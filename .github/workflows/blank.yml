name: Atualizar dashboard Kione

on:
  schedule:
    - cron: '0 9 * * *'    # 06:00 (Brasília)
    - cron: '0 15 * * *'   # 12:00 (Brasília)
    - cron: '30 2 * * *'   # 23:30 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Buscar dados no Meta Ads
        run: node kione-dashboard/scripts/update-data.mjs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: kione-dashboard/public
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
